<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Realidade Aumentada - Propriedade</title>
    <!-- Bibliotecas de RA e 3D -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-assets>
        <a-asset-item id="terrain-obj" src="terreno.obj"></a-asset-item>
        <a-asset-item id="terrain-mtl" src="terreno.mtl"></a-asset-item>
      </a-assets>

      <!-- Marcador Físico Padrão Hiro -->
      <a-marker preset="hiro">
        <!-- Rotacionamos o modelo para deitar sobre o papel e escalamos -->
        <a-entity 
          obj-model="obj: #terrain-obj; mtl: #terrain-mtl" 
          scale="1 1 1" 
          rotation="-90 0 0" 
          position="0 0.1 0">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
