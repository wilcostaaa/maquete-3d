<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Visualizador 3D Interativo - Propriedade</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Tela de Carregamento */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loader-text {
            margin-top: 20px;
            font-size: 16px;
            color: #00ff88;
            letter-spacing: 1px;
        }
        /* Painel Flutuante de Botoes */
        .ui-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            gap: 12px;
            z-index: 100;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .ui-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ui-btn:hover, .ui-btn:active {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }
        /* Instruções */
        .instruction-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 12px;
            pointer-events: none;
            border-left: 3px solid #00ff88;
        }
        .instruction-item {
            margin: 5px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text">Conectando ao modelo 3D...</div>
    </div>
    
    <div class="instruction-badge">
        <div class="instruction-item">👆 1 Dedo: Deslocar (Mover)</div>
        <div class="instruction-item">✌️ 2 Dedos: Zoom e Rotacionar (Girar)</div>
    </div>

    <div class="ui-panel">
        <button class="ui-btn" id="btn-reset">
            🔄 Resetar Vista
        </button>
        <button class="ui-btn" id="btn-grid">
            🌐 Grade Auxiliar
        </button>
        <a class="ui-btn" href="index.html" style="text-decoration: none; border-left: 1px solid rgba(255,255,255,0.15); padding-left: 12px; color: #00ff88;">
            📷 Realidade Aumentada
        </a>
    </div>

    <div id="canvas-container"></div>

    <!-- Import Map para Three.js ES Modules -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

        let scene, camera, renderer, controls, model;
        let gridHelper;
        const container = document.getElementById('canvas-container');

        init();
        animate();

        function init() {
            // Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121212);
            
            // Câmera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.8, 2.5); // Posição diagonal inicial

            // Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Controles de Órbita (Touch de Alta Performance)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; // Inércia para giro suave
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = true;
            controls.maxPolarAngle = Math.PI / 2.1; // Não permite passar por baixo da maquete
            controls.minDistance = 0.2;
            controls.maxDistance = 10;

            // Configurar gestos para celular:
            // 1 dedo: Pan (deslocar a câmera)
            // 2 dedos: Zoom (Pinch) e Rotação (girar com dois dedos)
            controls.touches.ONE = THREE.TOUCH.PAN;
            controls.touches.TWO = THREE.TOUCH.DOLLY_ROTATE;

            // Iluminação
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);
            
            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.35);
            dirLight2.position.set(-5, 5, -5);
            scene.add(dirLight2);

            // Grade Auxiliar
            gridHelper = new THREE.GridHelper(6, 60, 0x00ff88, 0x333333);
            gridHelper.position.y = -0.01;
            gridHelper.visible = false;
            scene.add(gridHelper);

            // Carregador de Materiais e OBJ
            const mtlLoader = new MTLLoader();
            mtlLoader.load('terreno.mtl', function(materials) {
                materials.preload();
                
                const objLoader = new OBJLoader();
                objLoader.setMaterials(materials);
                objLoader.load('terreno.obj', function(object) {
                    model = object;
                    
                    // Deitar a maquete na horizontal (Z geográfico vira Y no WebGL)
                    model.rotation.x = -Math.PI / 2;
                    
                    // Centralizar a maquete perfeitamente no ponto zero
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    
                    model.position.x -= center.x;
                    model.position.y -= center.y;
                    model.position.z -= center.z;
                    
                    // Alinhar a base com o plano zero
                    model.position.y -= box.min.y;

                    scene.add(model);
                    
                    // Sumir com tela de carregamento de forma suave
                    const loader = document.getElementById('loader');
                    loader.style.opacity = '0';
                    setTimeout(() => { loader.style.display = 'none'; }, 500);
                }, 
                function(xhr) {
                    if (xhr.lengthComputable) {
                        const percent = Math.round((xhr.loaded / xhr.total) * 100);
                        document.getElementById('loader-text').innerText = `Carregando Maquete: ${percent}%`;
                    }
                }, 
                function(error) {
                    console.error('Erro ao carregar o OBJ:', error);
                    document.getElementById('loader-text').innerText = 'Erro ao ler arquivos 3D.';
                });
            }, 
            undefined, 
            function(error) {
                console.error('Erro ao carregar o MTL:', error);
                document.getElementById('loader-text').innerText = 'Erro ao ler arquivo de materiais.';
            });

            // Responsividade
            window.addEventListener('resize', onWindowResize);
            
            // Botões de Controle
            document.getElementById('btn-reset').addEventListener('click', () => {
                controls.reset();
                camera.position.set(0, 1.8, 2.5);
                controls.target.set(0, 0, 0);
            });

            document.getElementById('btn-grid').addEventListener('click', () => {
                gridHelper.visible = !gridHelper.visible;
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Atualiza a física de damping
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
