<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Visualizador 3D Interativo - Propriedade</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Tela de Carregamento */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loader-text {
            margin-top: 20px;
            font-size: 16px;
            color: #00ff88;
            letter-spacing: 1px;
        }
        /* Painel Flutuante de Botoes */
        .ui-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            gap: 12px;
            z-index: 100;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .ui-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ui-btn:hover, .ui-btn:active {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }
        /* Instruções */
        .instruction-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 12px;
            pointer-events: none;
            border-left: 3px solid #00ff88;
        }
        .instruction-item {
            margin: 5px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text">Conectando ao modelo 3D...</div>
    </div>
    
    <div class="instruction-badge">
        <div class="instruction-item">👆 1 Dedo: Arrastar (Mover Mapa)</div>
        <div class="instruction-item">✌️ 2 Dedos: Zoom (Pinça) e Girar</div>
    </div>

    <div class="ui-panel">
        <button class="ui-btn" id="btn-reset">
            🔄 Resetar Vista
        </button>
        <button class="ui-btn" id="btn-grid">
            🌐 Grade Auxiliar
        </button>
        <a class="ui-btn" href="index.html" style="text-decoration: none; border-left: 1px solid rgba(255,255,255,0.15); padding-left: 12px; color: #00ff88;">
            📷 Realidade Aumentada
        </a>
    </div>

    <div id="canvas-container"></div>

    <!-- Import Map para Three.js ES Modules -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { MapControls } from 'three/addons/controls/MapControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

        let scene, camera, renderer, controls, model;
        let gridHelper;
        const container = document.getElementById('canvas-container');

        init();
        animate();

        function init() {
            // Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121212);
            
            // Câmera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.8, 2.5); // Posição diagonal inicial

            // Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Controles de Mapa (Navegação Estilo Google Earth)
            controls = new MapControls(camera, renderer.domElement);
            controls.enableDamping = true; // Inércia suave
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false; // Mover sempre paralelo ao chão
            controls.maxPolarAngle = Math.PI / 2.1; // Não permite passar por baixo da maquete
            controls.minDistance = 0.2;
            controls.maxDistance = 10;

            // Iluminação
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);
            
            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.35);
            dirLight2.position.set(-5, 5, -5);
            scene.add(dirLight2);

            // Grade Auxiliar
            gridHelper = new THREE.GridHelper(6, 60, 0x00ff88, 0x333333);
            gridHelper.position.y = -0.01;
            gridHelper.visible = false;
            scene.add(gridHelper);

            // Carregador de Materiais e OBJ
            const mtlLoader = new MTLLoader();
            mtlLoader.load('terreno.mtl', function(materials) {
                materials.preload();
                
                const objLoader = new OBJLoader();
                objLoader.setMaterials(materials);
                objLoader.load('terreno.obj', function(object) {
                    model = object;
                    
                    // Deitar a maquete na horizontal (Z geográfico vira Y no WebGL)
                    model.rotation.x = -Math.PI / 2;
                    
                    // Centralizar a maquete perfeitamente no ponto zero
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    
                    model.position.x -= center.x;
                    model.position.y -= center.y;
                    model.position.z -= center.z;
                    
                    // Alinhar a base com o plano zero
                    model.position.y -= box.min.y;

                    scene.add(model);
                    
                    // Gerar Floresta 3D Procedural a partir do mapeamento de cores (Diorama)
                    fetch('arvores.json')
                        .then(response => response.json())
                        .then(trees => {
                            model.updateMatrixWorld();
                            const finalBox = new THREE.Box3().setFromObject(model);
                            const treeCount = trees.length;
                            
                            // Geradores de Texturas Procedurais (Canvas) para manter performance e sem arquivos extras
                            function createWoodTexture() {
                                const canvas = document.createElement('canvas');
                                canvas.width = 64; canvas.height = 64;
                                const ctx = canvas.getContext('2d');
                                ctx.fillStyle = '#ffffff';
                                ctx.fillRect(0, 0, 64, 64);
                                for(let i=0; i<40; i++) {
                                    const v = Math.floor(100 + Math.random() * 100);
                                    ctx.fillStyle = `rgb(${v},${v},${v})`;
                                    ctx.fillRect(Math.random()*64, 0, Math.random()*3+1, 64);
                                }
                                const texture = new THREE.CanvasTexture(canvas);
                                texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
                                return texture;
                            }
                            
                            function createLeafTexture() {
                                const canvas = document.createElement('canvas');
                                canvas.width = 128; canvas.height = 128;
                                const ctx = canvas.getContext('2d');
                                ctx.fillStyle = '#ffffff';
                                ctx.fillRect(0, 0, 128, 128);
                                for(let i=0; i<300; i++) {
                                    const v = Math.floor(120 + Math.random() * 100);
                                    ctx.fillStyle = `rgb(${v},${v},${v})`;
                                    ctx.beginPath();
                                    ctx.arc(Math.random()*128, Math.random()*128, Math.random()*5+1, 0, Math.PI*2);
                                    ctx.fill();
                                }
                                const texture = new THREE.CanvasTexture(canvas);
                                texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
                                return texture;
                            }
                            
                            const woodMap = createWoodTexture();
                            const leafMap = createLeafTexture();
                            
                            const trunkGeo = new THREE.CylinderGeometry(0.001, 0.0015, 0.01, 5);
                            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6e4b30, map: woodMap });
                            const trunkMesh = new THREE.InstancedMesh(trunkGeo, trunkMat, treeCount);
                            
                            // Tipo 1: Árvore Caótica (Tetraedro - muito irregular)
                            const type1Geo = new THREE.TetrahedronGeometry(0.005, 0);
                            const type1Mat = new THREE.MeshLambertMaterial({ color: 0x4CAF50, map: leafMap });
                            const type1Mesh = new THREE.InstancedMesh(type1Geo, type1Mat, treeCount);

                            // Tipo 2: Árvore Pontiaguda (Octaedro)
                            const type2Geo = new THREE.OctahedronGeometry(0.005, 0);
                            const type2Mat = new THREE.MeshLambertMaterial({ color: 0x556B2F, map: leafMap });
                            const type2Mesh = new THREE.InstancedMesh(type2Geo, type2Mat, treeCount);

                            // Tipo 3: Árvore Savana irregular (Dodecaedro achatado)
                            const type3Geo = new THREE.DodecahedronGeometry(0.005, 0);
                            const type3Mat = new THREE.MeshLambertMaterial({ color: 0x6B8E23, map: leafMap });
                            const type3Mesh = new THREE.InstancedMesh(type3Geo, type3Mat, treeCount);

                            // Tipo 4: Arbusto Denso irregular (Icosaedro com detalhe 0)
                            const type4Geo = new THREE.IcosahedronGeometry(0.005, 0);
                            const type4Mat = new THREE.MeshLambertMaterial({ color: 0x8FBC8F, map: leafMap });
                            const type4Mesh = new THREE.InstancedMesh(type4Geo, type4Mat, treeCount);
                            
                            const dummy = new THREE.Object3D();
                            const raycaster = new THREE.Raycaster();
                            const downVector = new THREE.Vector3(0, -1, 0);
                            
                            let addedTrunk = 0;
                            let added1 = 0; let added2 = 0; let added3 = 0; let added4 = 0;
                            
                            for(let i = 0; i < treeCount; i++) {
                                const u = trees[i][0];
                                const v = trees[i][1];
                                
                                const tx = finalBox.min.x + u * (finalBox.max.x - finalBox.min.x);
                                const tz = finalBox.min.z + v * (finalBox.max.z - finalBox.min.z);
                                
                                // Dispara o raio lá do alto (Y=100)
                                const rayOrigin = new THREE.Vector3(tx, 100.0, tz);
                                raycaster.set(rayOrigin, downVector);
                                const intersects = raycaster.intersectObject(model, true);
                                
                                if(intersects.length > 0) {
                                    const ty = intersects[0].point.y;
                                    
                                    const scale = 0.6 + Math.random() * 0.9;
                                    
                                    // Distorção caótica para que cada copa seja única (quebra a redondeza)
                                    const scaleX = scale * (0.7 + Math.random() * 0.6);
                                    const scaleY = scale * (0.6 + Math.random() * 0.6);
                                    const scaleZ = scale * (0.7 + Math.random() * 0.6);
                                    
                                    // Rotação completamente caótica para a copa (tira a previsibilidade)
                                    const rotX = Math.random() * Math.PI; 
                                    const rotY = Math.random() * Math.PI * 2;
                                    const rotZ = Math.random() * Math.PI;
                                    
                                    // Tronco (inclinado levemente)
                                    dummy.position.set(tx, ty + (0.005 * scaleY), tz);
                                    dummy.rotation.set((Math.random() - 0.5) * 0.3, rotY, (Math.random() - 0.5) * 0.3);
                                    dummy.scale.set(scale, scaleY, scale);
                                    dummy.updateMatrix();
                                    trunkMesh.setMatrixAt(addedTrunk, dummy.matrix);
                                    addedTrunk++;
                                    
                                    const r = Math.random();
                                    
                                    // Aplica rotação e escala caótica na copa
                                    dummy.rotation.set(rotX, rotY, rotZ);
                                    
                                    if(r < 0.25) {
                                        dummy.position.set(tx, ty + (0.011 * scaleY), tz);
                                        dummy.scale.set(scaleX, scaleY, scaleZ);
                                        dummy.updateMatrix();
                                        type1Mesh.setMatrixAt(added1, dummy.matrix);
                                        added1++;
                                    } else if(r < 0.5) {
                                        dummy.position.set(tx, ty + (0.012 * scaleY), tz);
                                        dummy.scale.set(scaleX, scaleY, scaleZ);
                                        dummy.updateMatrix();
                                        type2Mesh.setMatrixAt(added2, dummy.matrix);
                                        added2++;
                                    } else if(r < 0.75) {
                                        dummy.position.set(tx, ty + (0.010 * scaleY), tz);
                                        dummy.scale.set(scaleX * 1.4, scaleY * 0.5, scaleZ * 1.4); // Achatada
                                        dummy.updateMatrix();
                                        type3Mesh.setMatrixAt(added3, dummy.matrix);
                                        added3++;
                                    } else {
                                        dummy.position.set(tx, ty + (0.012 * scaleY), tz);
                                        dummy.scale.set(scaleX, scaleY, scaleZ);
                                        dummy.updateMatrix();
                                        type4Mesh.setMatrixAt(added4, dummy.matrix);
                                        added4++;
                                    }
                                }
                            }
                            
                            trunkMesh.count = addedTrunk;
                            type1Mesh.count = added1;
                            type2Mesh.count = added2;
                            type3Mesh.count = added3;
                            type4Mesh.count = added4;
                            
                            scene.add(trunkMesh);
                            scene.add(type1Mesh);
                            scene.add(type2Mesh);
                            scene.add(type3Mesh);
                            scene.add(type4Mesh);
                        })
                        .catch(err => console.log('Aviso: arquivo arvores.json não encontrado.'));
                    
                    // Sumir com tela de carregamento de forma suave
                    const loader = document.getElementById('loader');
                    loader.style.opacity = '0';
                    setTimeout(() => { loader.style.display = 'none'; }, 500);
                }, 
                function(xhr) {
                    if (xhr.lengthComputable) {
                        const percent = Math.round((xhr.loaded / xhr.total) * 100);
                        document.getElementById('loader-text').innerText = `Carregando Maquete: ${percent}%`;
                    }
                }, 
                function(error) {
                    console.error('Erro ao carregar o OBJ:', error);
                    document.getElementById('loader-text').innerText = 'Erro ao ler arquivos 3D.';
                });
            }, 
            undefined, 
            function(error) {
                console.error('Erro ao carregar o MTL:', error);
                document.getElementById('loader-text').innerText = 'Erro ao ler arquivo de materiais.';
            });

            // Responsividade
            window.addEventListener('resize', onWindowResize);
            
            // Botões de Controle
            document.getElementById('btn-reset').addEventListener('click', () => {
                controls.reset();
                camera.position.set(0, 1.8, 2.5);
                controls.target.set(0, 0, 0);
            });

            document.getElementById('btn-grid').addEventListener('click', () => {
                gridHelper.visible = !gridHelper.visible;
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Atualiza a física de damping
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
